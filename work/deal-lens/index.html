<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal Lens — St. Louis Sale 237</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    /* surfaces — intentional warm light */
    --canvas:#F7F3EC; --surface:#FFFFFF; --surface-2:#FBF8F2; --inset:#F1EBE0;
    --ink:#211E18; --ink-soft:#6C665B; --ink-faint:#9A9384;
    --line:#E7E0D3; --line-2:#D8CFBE;
    /* brand + wayfinding */
    --brand:#BE7C16; --brand-deep:#9C6610; --brand-tint:#F6ECD5;
    /* semantic system: green = good, amber = attention/your-number, orange = caution, clay = risk */
    --good:#2E8460; --good-tint:#E1EFE8;
    --caution:#C46A26; --caution-tint:#F7E8D7;
    --risk:#B4453A; --risk-tint:#F6E1DC;
    --info:#3F7AA6; --info-tint:#E2EDF4;
    --shadow:0 1px 2px rgba(40,33,20,.04),0 4px 16px rgba(40,33,20,.05);
    --shadow-lift:0 2px 6px rgba(40,33,20,.06),0 12px 34px rgba(40,33,20,.10);
    --mono:'JetBrains Mono',ui-monospace,monospace; --sans:'Inter',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif;
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--canvas);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  ::selection{background:var(--brand-tint)}
  .wrap{max-width:1340px;margin:0 auto;padding:0 26px}

  /* ---------- top nav ---------- */
  .nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0 16px;gap:16px;flex-wrap:wrap}
  .brand{font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.3px;display:flex;align-items:center;gap:10px}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;box-shadow:var(--shadow)}
  .brand .sub{font-family:var(--sans);font-weight:500;font-size:11px;color:var(--ink-faint);letter-spacing:.3px}
  .nav-right{display:flex;align-items:center;gap:10px}
  .crumbs{font-size:13px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
  .crumbs a{color:var(--brand-deep);cursor:pointer;font-weight:500;text-decoration:none}
  .crumbs a:hover{text-decoration:underline}
  .btn{font-family:var(--sans);font-weight:500;font-size:13px;padding:9px 15px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:var(--brand);box-shadow:var(--shadow)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{background:var(--brand-deep)}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
  .btn.ghost:hover{background:var(--inset);border-color:transparent}

  .divider{height:1px;background:var(--line);margin-bottom:22px}

  /* ---------- list view ---------- */
  .pagehead{margin-bottom:20px}
  .pagehead h1{font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:-.4px;margin-bottom:5px}
  .pagehead p{color:var(--ink-soft);font-size:14.5px;max-width:680px}
  .summary{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  @media(max-width:880px){.summary{grid-template-columns:1fr 1fr}}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--ink-soft);font-weight:500;margin-bottom:7px}
  .stat .v{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1}
  .stat .n{font-size:11.5px;color:var(--ink-faint);margin-top:6px}
  .stat .v.good{color:var(--good)} .stat .v.brand{color:var(--brand-deep)}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .seg{display:inline-flex;background:var(--inset);border-radius:10px;padding:3px}
  .seg button{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:7px 13px;border:none;background:transparent;color:var(--ink-soft);border-radius:8px;cursor:pointer;transition:.14s}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .filterbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .chip{font-family:var(--sans);font-size:12.5px;font-weight:500;padding:7px 13px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-soft);cursor:pointer;transition:.14s;display:inline-flex;align-items:center;gap:7px}
  .chip:hover{border-color:var(--ink-faint)}
  .chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
  .chip .swt{width:8px;height:8px;border-radius:2px;display:inline-block}
  .search{font-family:var(--sans);font-size:13px;padding:8px 13px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);width:210px;outline:none}
  .search:focus{border-color:var(--brand)}

  #listmap{height:300px;border-radius:var(--r);border:1px solid var(--line);overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow);background:var(--inset)}
  .map-fallback{display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--sans);font-size:13px;color:var(--ink-faint);padding:24px;line-height:1.6;height:100%}

  .listwrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse}
  thead th{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-faint);text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);cursor:pointer;user-select:none;white-space:nowrap}
  thead th.num{text-align:right}
  thead th:hover{color:var(--ink-soft)}
  tbody tr{border-bottom:1px solid var(--line);cursor:pointer;transition:.1s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--surface-2)}
  tbody td{padding:13px 16px;font-size:13.5px;vertical-align:middle}
  td.num{text-align:right;font-family:var(--mono);font-weight:500}
  .addr-cell .a{font-weight:600;font-size:14px}
  .addr-cell .o{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
  .pill{font-family:var(--sans);font-size:11px;font-weight:600;padding:4px 9px;border-radius:99px;white-space:nowrap;display:inline-block}
  .pill.land{background:var(--info-tint);color:var(--info)}
  .pill.flip{background:var(--caution-tint);color:var(--caution)}
  .pill.hold{background:var(--good-tint);color:var(--good)}
  .pill.resale{background:var(--brand-tint);color:var(--brand-deep)}
  .pill.unrated{background:var(--inset);color:var(--ink-faint)}
  .pill.risk{background:var(--risk-tint);color:var(--risk)}
  .pill.info{background:var(--info-tint);color:var(--info)}
  .tierdot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .roi-cell{font-family:var(--mono);font-weight:600;font-size:14px}
  .roi-cell.pos{color:var(--good)} .roi-cell.neg{color:var(--risk)} .roi-cell.na{color:var(--ink-faint);font-weight:500}
  .zone-tag{font-size:11.5px;color:var(--ink-soft)}

  /* ---------- deal view ---------- */
  .deal{display:grid;grid-template-columns:340px 1.35fr 1fr;gap:18px;align-items:start}
  @media(max-width:1180px){.deal{grid-template-columns:1fr}}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .card .ch{padding:15px 18px 0;display:flex;align-items:center;justify-content:space-between}
  .card .ch h3{font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--ink-faint)}
  .card .ch .note{font-size:11px;color:var(--ink-faint)}
  .card .cb{padding:16px 18px 18px}

  .tierband{display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:var(--r) var(--r) 0 0;font-size:12.5px;font-weight:600}
  .tierband.A{background:var(--good-tint);color:var(--good)}
  .tierband.B{background:var(--caution-tint);color:var(--caution)}
  .tierband.U{background:var(--inset);color:var(--ink-faint)}

  .dealhead h2{font-family:var(--serif);font-weight:600;font-size:24px;letter-spacing:-.3px;margin-bottom:3px}
  .dealhead .loc{font-size:13px;color:var(--ink-soft);margin-bottom:14px}
  .strat-line{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:16px}
  .strat-main{font-family:var(--sans);font-size:13px;font-weight:600;padding:7px 13px;border-radius:9px}
  .strat-or{font-size:12.5px;color:var(--ink-soft)}

  .factgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .fcell{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .fcell .k{font-size:11px;color:var(--ink-faint);font-weight:500;margin-bottom:4px}
  .fcell .v{font-size:15px;font-weight:600}
  .fcell .v.mono{font-family:var(--mono)}

  .readout{font-size:13.5px;line-height:1.6;color:var(--ink);background:var(--brand-tint);border-radius:11px;padding:13px 15px;margin-bottom:14px}
  .reason{font-size:13px;line-height:1.6;color:var(--ink-soft)}
  .reason .lead{font-weight:600;color:var(--ink);display:block;margin-bottom:4px;font-size:12px;text-transform:uppercase;letter-spacing:.3px}

  .riskline{margin-top:16px}
  .risk-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
  .risk-row .rk{font-size:13px;color:var(--ink-soft)}
  .risk-row .rk small{display:block;color:var(--ink-faint);font-size:11px}
  .meter{display:flex;gap:3px;align-items:center}
  .mlabel{font-size:11.5px;font-weight:600;margin-right:9px}
  .mlabel.good{color:var(--good)} .mlabel.mid{color:var(--caution)} .mlabel.bad{color:var(--risk)}
  .pip{width:18px;height:6px;border-radius:3px;background:var(--inset)}
  .pip.on.good{background:var(--good)} .pip.on.mid{background:var(--caution)} .pip.on.bad{background:var(--risk)}

  /* map + comps */
  #dealmap{height:300px;border-radius:11px;border:1px solid var(--line);overflow:hidden;background:var(--inset)}
  .maptools{display:flex;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px}
  .layers{display:flex;gap:8px;flex-wrap:wrap}
  .layer{font-size:12px;font-weight:500;padding:6px 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-soft);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.14s}
  .layer:hover{border-color:var(--ink-faint)}
  .layer.on{background:var(--inset);border-color:var(--ink-faint);color:var(--ink)}
  .layer .ld{width:8px;height:8px;border-radius:50%}
  .maplegend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-soft)}
  .maplegend div{display:flex;align-items:center;gap:6px}
  .ldot{width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line-2)}

  .complist{margin-top:6px}
  .comp{border:1px solid var(--line);border-radius:11px;padding:0;margin-bottom:9px;cursor:pointer;transition:.14s;overflow:hidden;background:var(--surface)}
  .comp:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
  .comp.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
  .comp-top{display:flex;align-items:center;gap:11px;padding:11px 13px}
  .comp-photo{width:46px;height:46px;border-radius:8px;background:var(--inset);flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:10px;text-align:center;line-height:1.2;overflow:hidden}
  .comp-photo img{width:100%;height:100%;object-fit:cover}
  .comp-mid{flex:1;min-width:0}
  .comp-label{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .comp-note{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
  .comp-val{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap;flex:none}
  .comp-meta{display:flex;gap:7px;flex-wrap:wrap;padding:0 13px 11px;align-items:center}
  .tag{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
  .tag.src-mls{background:var(--good-tint);color:var(--good)}
  .tag.src-listing{background:var(--brand-tint);color:var(--brand-deep)}
  .tag.src-assessor{background:var(--info-tint);color:var(--info)}
  .tag.src-estimate{background:var(--inset);color:var(--ink-soft)}
  .tag.src-web{background:var(--caution-tint);color:var(--caution)}
  .metabit{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono)}
  .metabit b{color:var(--ink);font-weight:600}
  .sourcelink{font-size:11.5px;color:var(--brand-deep);font-weight:500;margin-left:auto}
  .sourcelink.disabled{color:var(--ink-faint);font-weight:400}
  .simbar{height:5px;border-radius:3px;background:var(--inset);overflow:hidden;flex:1;min-width:40px;max-width:80px}
  .simbar i{display:block;height:100%;background:var(--good)}

  /* underwriting */
  .uw-toggle{display:inline-flex;background:var(--inset);border-radius:9px;padding:3px;margin-bottom:14px}
  .uw-toggle button{font-size:12px;font-weight:500;padding:6px 12px;border:none;background:transparent;color:var(--ink-soft);border-radius:7px;cursor:pointer}
  .uw-toggle button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .walk{border:1px solid var(--brand);background:linear-gradient(160deg,var(--brand-tint),#fff);border-radius:12px;padding:15px 16px;margin-bottom:15px}
  .walk .wk{font-size:12px;font-weight:600;color:var(--brand-deep);margin-bottom:3px}
  .walk .wv{font-family:var(--serif);font-size:33px;font-weight:600;color:var(--brand-deep);line-height:1}
  .walk .ws{font-size:12.5px;color:var(--ink-soft);margin-top:7px;line-height:1.5}
  .walk .ws b{color:var(--ink);font-weight:600}
  .walk.over{border-color:var(--risk);background:linear-gradient(160deg,var(--risk-tint),#fff)}
  .walk.over .wk,.walk.over .wv{color:var(--risk)}

  .outs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:15px}
  .ocell{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px;text-align:center}
  .ocell .k{font-size:10.5px;color:var(--ink-faint);font-weight:500;margin-bottom:5px}
  .ocell .v{font-family:var(--mono);font-size:16px;font-weight:600}
  .ocell .v.pos{color:var(--good)} .ocell .v.neg{color:var(--risk)}

  .chainwrap{margin-bottom:8px}
  .chain-cap{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-soft);margin-bottom:5px}
  .track{height:24px;background:var(--inset);border-radius:7px;overflow:hidden;display:flex}
  .seg2{height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;transition:width .4s ease}
  .seg2 span{font-family:var(--mono);font-size:9.5px;font-weight:600;color:#fff;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.15)}
  .chain-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;font-size:11px;color:var(--ink-soft)}
  .chain-legend div{display:flex;align-items:center;gap:5px}
  .csw{width:9px;height:9px;border-radius:2px}

  .ctrl{margin-bottom:13px}
  .ctrl-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
  .ctrl-top label{font-size:12.5px;color:var(--ink-soft);font-weight:500}
  .ctrl-top .val{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--brand-deep)}
  input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:4px;background:var(--line-2);outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--brand);cursor:pointer;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--brand);cursor:pointer;border:2px solid #fff}
  .advanced{border-top:1px solid var(--line);margin-top:6px;padding-top:13px}
  .adv-toggle{font-size:12.5px;font-weight:500;color:var(--brand-deep);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
  .adv-body{margin-top:13px;display:none}
  .adv-body.open{display:block}
  .reset{width:100%;margin-top:8px;background:transparent;border:1px solid var(--line-2);color:var(--ink-soft);font-family:var(--sans);font-size:12.5px;font-weight:500;padding:10px;border-radius:9px;cursor:pointer}
  .reset:hover{border-color:var(--brand);color:var(--brand-deep)}

  /* compare mode */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cmp-col{border:1px solid var(--line);border-radius:11px;padding:13px;background:var(--surface-2)}
  .cmp-col h4{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;gap:7px}
  .cmp-col h4 .badge{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
  .cmp-walk{font-family:var(--serif);font-size:22px;font-weight:600;color:var(--brand-deep);margin-bottom:4px}
  .cmp-line{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-top:1px solid var(--line)}
  .cmp-line .l{color:var(--ink-soft)} .cmp-line .r{font-family:var(--mono);font-weight:600}
  .delta{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:12px;padding:10px;background:var(--inset);border-radius:9px}
  .delta b{font-family:var(--mono)}
  .mini-ctrl{margin-bottom:9px}
  .mini-ctrl .ctrl-top label{font-size:11.5px}
  .mini-ctrl .ctrl-top .val{font-size:12px}

  /* chat */
  .chatfab{position:fixed;right:24px;bottom:24px;z-index:900;background:var(--brand);color:#fff;border:none;border-radius:99px;padding:13px 19px;font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer;box-shadow:var(--shadow-lift);display:flex;align-items:center;gap:9px}
  .chatfab:hover{background:var(--brand-deep)}
  .chatpanel{position:fixed;right:24px;bottom:24px;width:380px;max-width:calc(100vw - 48px);height:560px;max-height:calc(100vh - 48px);background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--shadow-lift);z-index:950;display:none;flex-direction:column;overflow:hidden}
  .chatpanel.open{display:flex}
  .chat-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--surface-2)}
  .chat-head .t{font-family:var(--serif);font-weight:600;font-size:16px;display:flex;align-items:center;gap:9px}
  .chat-head .t .mark{width:24px;height:24px;border-radius:7px;background:linear-gradient(145deg,var(--brand),var(--brand-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
  .chat-x{border:none;background:transparent;color:var(--ink-faint);font-size:20px;cursor:pointer;line-height:1}
  .chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:84%;font-size:13.5px;line-height:1.55;padding:11px 14px;border-radius:14px}
  .msg.bot{background:var(--surface-2);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:5px;color:var(--ink)}
  .msg.user{background:var(--brand);color:#fff;align-self:flex-end;border-bottom-right-radius:5px}
  .msg.bot b{color:var(--brand-deep)}
  .chat-suggest{padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2)}
  .chat-suggest .lbl{font-size:11px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:9px}
  .sugg{display:flex;flex-direction:column;gap:7px}

const STRAT={land:{cls:"land",t:"Land flip"},hold:{cls:"hold",t:"Buy and hold"},flip:{cls:"flip",t:"Fix and flip"},resale:{cls:"resale",t:"Resale"},unrated:{cls:"unrated",t:"Not yet analyzed"}};
const TIERMETA={A:{color:"#2E8460",label:"Verified deal",band:"This property has been researched and the value is backed by real comparable evidence."},
  B:{color:"#C46A26",label:"Verify before bidding",band:"This property looks promising but the value still rests on area estimates. Confirm it in person before you bid."},
  U:{color:"#9A9384",label:"Imported, not yet analyzed",band:"This row came straight from the sale list. It has not been researched yet."}};
const SRCMETA={mls:{cls:"src-mls",t:"Recorded sale"},listing:{cls:"src-listing",t:"Live listing"},assessor:{cls:"src-assessor",t:"Assessor"},estimate:{cls:"src-estimate",t:"Automated estimate"},web:{cls:"src-web",t:"Web research"}};
const PINCOLOR={subject:"#BE7C16",mls:"#2E8460",listing:"#BE7C16",assessor:"#3F7AA6",estimate:"#9A9384",web:"#C46A26",amenity:"#6C665B"};

/* ------------------------------------------------------------
   Honest auto-classification for parcels not yet hand-researched.
   This is NOT a valuation. It sorts the remaining list into plain
   buckets with a stated reason, so nothing is left blank and the
   passes are clearly separated from the leads worth field work.
   ------------------------------------------------------------ */
const CATMETA={
  eminent:{color:"#B4453A",label:"Avoid, redevelopment trap",chip:"risk",
    why:"This parcel sits in the Pruitt-Igoe and Phoenix I LP group that is tied up in eminent-domain condemnation. You could win it and still lose it. Pass."},
  north:{color:"#9A9384",label:"North City, likely a pass",chip:"unrated",
    why:"This is in the North City area most affected by the 2025 tornado and the demolition pipeline. Most parcels here are now shells or empty lots in a soft market. Treat as land-bank only unless you have a specific reason."},
  commercial:{color:"#9A9384",label:"Large or commercial, likely over budget",chip:"unrated",
    why:"The size of the unpaid balance points to a large or commercial building. It is likely well above a thirty thousand dollar budget, so it is here for awareness rather than as a target."},
  lot:{color:"#9A9384",label:"Likely a low-value lot",chip:"unrated",
    why:"The very small balance owed usually means a vacant lot or a minor parcel in a weak market. Low cost, but also low resale unless it adjoins something you own."},
  investor:{color:"#C46A26",label:"Investor owned, worth understanding",chip:"flip",
    why:"The owner is a company rather than a person, which means a professional let it fall into the sale. That is either a known problem they walked away from or a portfolio they are shedding. Worth a look once you know which."},
  south:{color:"#3F7AA6",label:"South City, worth field work",chip:"info",
    why:"This is a South City residential parcel in a neighborhood with a real resale market. It has not been individually pulled yet, but it is the kind of property worth a drive-by and a comparable check."}
};
function isInvestorOwner(o){return /LLC|L\.L\.C|TRUST|INVESTMENT|REALTY|DEVELOPMENT|PROPERT|PARTNERS|GROUP|HOMES|CHURCH|UNLIMITED|NOTE|PRESERVATION|SOLUTIONS|CO$/i.test(o);}
function classify(id,owner,addr,floor,zone){
  if(/Phoenix I LP|Pruitt-Igoe|LCRA/i.test(owner)) return "eminent";
  if(zone==="north") return "north";
  if(floor>=31000) return "commercial";
  if(floor<1500) return "lot";
  if(isInvestorOwner(owner)) return "investor";
  return "south";
}

/* build the full property objects */
const PROPS = RAW.map((r,i)=>{
  const [id,owner,addr,floor]=r;
  const zone=zoneFor(addr);
  const z=ZONES[zone];
  const deep=DEEP[id]||null;
  const lat = deep&&deep.lat ? deep.lat : z.lat + jitter(i+1)*0.022;
  const lng = deep&&deep.lng ? deep.lng : z.lng + jitter(i+7)*0.030;
  let strat = deep?deep.strat:"unrated";
  let tier = deep?deep.tier:"U";
  let cat = deep?null:classify(id,owner,addr,floor,zone);
  return {id,owner,addr,floor,zone,zoneName:z.name,lat,lng,researched:!!deep,strat,tier,cat,
    type:deep?deep.type:null,size:deep?deep.size:null,readout:deep?deep.readout:null,reason:deep?deep.reason:null,
    d:deep?deep.d:null,max:deep?deep.max:null,risk:deep?deep.risk:null,comps:deep?deep.comps:[],strat2:deep?deep.strat2:null};
});
</script>

<script>
/* ============================================================
   STATE — single source of truth. View, map, and chat all read
   and write here, then call render(). This is the shared spine.
   ============================================================ */
const APP = {
  view:"list",
  selectedId:"237-005",
  filter:"all",        // all | A | B | land | flip | hold | resale
  sort:{key:"opportunity",dir:-1},
  search:"",
  target:30,
  uwMode:"single",     // single | compare
  advOpen:false,
  scenarios:{},        // per-property: {A:{...}, B:{...}}
  chatOpen:false
};

const $ = s=>document.querySelector(s);
const M = n => "$"+Math.round(n).toLocaleString();
const Mk = n => { const a=Math.abs(n); if(a>=1000){ let v=a/1000; let s=(a>=100000?v.toFixed(0):v.toFixed(1)).replace(/\.0$/,""); return (n<0?"-$":"$")+s+"k"; } return (n<0?"-$":"$")+Math.round(a); };
function prop(id){return PROPS.find(p=>p.id===(id||APP.selectedId));}

function scenarioFor(id,key){
  if(!APP.scenarios[id]) APP.scenarios[id]={};
  if(!APP.scenarios[id][key]){
    const base=prop(id).d || {bid:20000,title:5000,rehab:25000,months:9,arv:120000,holdPerMo:300,sellPct:7};
    APP.scenarios[id][key]=Object.assign({},base);
  }
  return APP.scenarios[id][key];
}
function calc(s,target){
  const sellCost=s.arv*(s.sellPct/100), holding=s.months*s.holdPerMo, fixed=s.title+s.rehab+holding;
  const cashIn=s.bid+fixed, totalCost=cashIn+sellCost, net=s.arv-totalCost;
  const roi=cashIn>0?net/cashIn*100:0, ann=roi/(s.months/12);
  const tf=target/100, K=s.arv-sellCost-fixed, walk=(K-tf*fixed)/(1+tf);
  return {sellCost,holding,fixed,cashIn,totalCost,net,roi,ann,walk};
}
/* opportunity score for sorting unresearched-aware list */
function opp(p){
  if(!p.researched) return -1;
  const s=scenarioFor(p.id,"A"); return calc(s,APP.target).roi;
}

/* ============================================================
   MAPS
   ============================================================ */
let listMap,listLayer,listOK=false;
let dealMap,dealLayer,dealMarkers=[],dealOK=false,dealLayers={comps:true,amenities:false,tornado:false};
function pin(color,size,ring){size=size||14;return L.divIcon({className:"",iconSize:[size,size],iconAnchor:[size/2,size/2],
  html:'<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+color+';border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.25)'+(ring?',0 0 0 3px '+color+'44':'')+'"></div>'});}
function tile(map){L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',subdomains:'abcd',maxZoom:19}).addTo(map);}

function initListMap(){
  try{
    if(typeof L==="undefined")throw 0;
    listMap=L.map("listmap",{zoomControl:true,scrollWheelZoom:false}).setView([38.61,-90.235],12);
    tile(listMap); listLayer=L.layerGroup().addTo(listMap); listOK=true; drawListMap();
  }catch(e){ $("#listmap").innerHTML='<div class="map-fallback">The city map renders here when opened with a live connection. It plots every parcel in the sale and you can click any pin to open that property.</div>'; }
}
function drawListMap(){
  if(!listOK)return; listLayer.clearLayers();
  visibleProps().forEach(p=>{
    const col = p.researched ? TIERMETA[p.tier].color : "#C9C0B0";
    const mk=L.marker([p.lat,p.lng],{icon:pin(col,p.researched?13:9)}).addTo(listLayer);
    mk.bindPopup('<b>'+p.addr+'</b><br>'+p.zoneName+'<br>Floor bid '+M(p.floor)+'<br><span class="pop-link" onclick="openDeal(\''+p.id+'\')">Open this property</span>');
    mk.on("click",()=>mk.openPopup());
  });
}
function initDealMap(){
  try{
    if(typeof L==="undefined")throw 0;
    const p=prop();
    dealMap=L.map("dealmap",{zoomControl:true,scrollWheelZoom:false}).setView([p.lat,p.lng],15);
    tile(dealMap); dealLayer=L.layerGroup().addTo(dealMap); dealOK=true; drawDealMap();
  }catch(e){ const el=$("#dealmap"); if(el) el.innerHTML='<div class="map-fallback">The neighborhood map renders here with a live connection, showing the subject property and its comparable sales. Click a comparable below to highlight it.</div>'; }
}
function drawDealMap(){
  if(!dealOK)return; dealLayer.clearLayers(); dealMarkers=[];
  const p=prop();
  L.marker([p.lat,p.lng],{icon:pin(PINCOLOR.subject,18,true)}).addTo(dealLayer)
    .bindPopup('<b>'+p.addr+'</b><br>The property you are evaluating<br>Floor bid '+M(p.floor));
  if(dealLayers.comps){
    p.comps.forEach((c,i)=>{ if(c.lat){
      const col=PINCOLOR[c.src]||PINCOLOR.assessor;
      const mk=L.marker([c.lat,c.lng],{icon:pin(col,13)}).addTo(dealLayer)
        .bindPopup('<b>'+c.label+'</b><br>'+c.val+'<br>'+SRCMETA[c.src].t);
      mk.on("click",()=>{selComp=i;renderComps();});
      dealMarkers[i]=mk;
    }});
  }
  if(dealLayers.amenities){
    const a=[[p.lat+0.004,p.lng+0.003,"Coffee and cafe"],[p.lat-0.003,p.lng+0.005,"Park"],[p.lat+0.002,p.lng-0.004,"Grocery"]];
    a.forEach(x=>L.marker([x[0],x[1]],{icon:pin(PINCOLOR.amenity,9)}).addTo(dealLayer)
      .bindPopup('<b>'+x[2]+'</b><br>Illustrative until the places data source is connected'));
  }
  if(dealLayers.tornado && p.zone==="north"){
    L.circle([p.lat,p.lng],{radius:600,color:"#B4453A",fillColor:"#B4453A",fillOpacity:.08,weight:1}).addTo(dealLayer)
      .bindPopup("Approximate 2025 tornado damage context. This area saw heavy structural damage that reshaped local value.");
  }
  dealMap.flyTo([p.lat,p.lng],15,{duration:.5});
}

/* ============================================================
   LIST VIEW
   ============================================================ */
function visibleProps(){
  let list=PROPS.slice();
  const f=APP.filter;
  if(f==="A"||f==="B") list=list.filter(p=>p.tier===f);
  else if(f==="leads") list=list.filter(p=>p.researched||p.cat==="south"||p.cat==="investor");
  else if(f==="south") list=list.filter(p=>!p.researched&&p.cat==="south");
  else if(["land","flip","hold","resale"].includes(f)) list=list.filter(p=>p.researched&&p.strat===f);
  if(APP.search.trim()){
    const q=APP.search.toLowerCase();
    list=list.filter(p=>p.addr.toLowerCase().includes(q)||p.owner.toLowerCase().includes(q)||p.id.includes(q)||p.zoneName.toLowerCase().includes(q));
  }
  const k=APP.sort.key,dir=APP.sort.dir;
  list.sort((a,b)=>{
    let va,vb;
    if(k==="opportunity"){va=opp(a);vb=opp(b);}
    else if(k==="floor"){va=a.floor;vb=b.floor;}
    else if(k==="addr"){va=a.addr;vb=b.addr;return dir*va.localeCompare(vb);}
    else if(k==="zone"){va=a.zoneName;vb=b.zoneName;return dir*va.localeCompare(vb);}
    else {va=a.floor;vb=b.floor;}
    return dir*(va-vb);
  });
  return list;
}
/* shared row helpers so the full render and the search re-render stay identical */
function dotColor(p){ return p.researched ? TIERMETA[p.tier].color : CATMETA[p.cat].color; }
function pillFor(p){
  if(p.researched) return '<span class="pill '+STRAT[p.strat].cls+'">'+STRAT[p.strat].t+'</span>';
  const c=CATMETA[p.cat]; return '<span class="pill '+c.chip+'">'+c.label+'</span>';
}
function rowHtml(p){
  const r=p.researched?calc(scenarioFor(p.id,"A"),APP.target):null;
  const roiCell=p.researched
    ? '<span class="roi-cell '+(r.roi>=0?"pos":"neg")+'">'+(r.roi>=0?"+":"")+r.roi.toFixed(0)+'%</span>'
    : '<span class="roi-cell na">Not analyzed</span>';
  const tierDot='<span class="tierdot" style="background:'+dotColor(p)+'"></span>';
  return '<tr onclick="openDeal(\''+p.id+'\')">'+
    '<td><div class="addr-cell"><div class="a">'+tierDot+p.addr+'</div><div class="o">'+p.owner+' · '+p.id+'</div></div></td>'+
    '<td><span class="zone-tag">'+p.zoneName+'</span></td>'+
    '<td>'+pillFor(p)+'</td>'+
    '<td class="num">'+M(p.floor)+'</td>'+
    '<td class="num">'+roiCell+'</td>'+
  '</tr>';
}
function renderList(){
  const researched=PROPS.filter(p=>p.researched);
  const verified=PROPS.filter(p=>p.tier==="A");
  const leads=PROPS.filter(p=>!p.researched&&(p.cat==="south"||p.cat==="investor")).length;
  const bestRoi=Math.max(...researched.map(p=>calc(scenarioFor(p.id,"A"),APP.target).roi));
  const north=PROPS.filter(p=>p.zone==="north").length;
  const south=PROPS.length-north;

  let filterChips="";
  [["all","All properties",null],["leads","Worth a look",null],["A","Verified",TIERMETA.A.color],["B","Verify first",TIERMETA.B.color],
   ["south","South leads",CATMETA.south.color],["flip","Fix and flip",null],["hold","Buy and hold",null]].forEach(([k,label,sw])=>{
    filterChips+='<button class="chip'+(APP.filter===k?" on":"")+'" onclick="setFilter(\''+k+'\')">'+(sw?'<span class="swt" style="background:'+sw+'"></span>':"")+label+'</button>';
  });

  const vis=visibleProps();
  const rows=vis.map(rowHtml).join("");

  $("#view-list").innerHTML=`
    <div class="pagehead">
      <h1>The sale at a glance</h1>
      <p>Every parcel in St. Louis Land Tax Sale 237, imported from the official list. ${researched.length} are researched in depth and carry a full valuation. Every other parcel is sorted into an honest category with a stated reason, so the deals worth your time are separated from the ones to pass on. Sort by return to bring the strongest to the top, filter to Worth a look to hide the passes, or open any property to study it.</p>
    </div>
    <div class="summary">
      <div class="stat"><div class="k">Parcels in this sale</div><div class="v">${PROPS.length}</div><div class="n">${researched.length} researched, the rest categorized</div></div>
      <div class="stat"><div class="k">Verified deals</div><div class="v good">${verified.length}</div><div class="n">Value backed by real comparables</div></div>
      <div class="stat"><div class="k">Leads to chase</div><div class="v brand">${leads}</div><div class="n">South City parcels worth field work</div></div>
      <div class="stat"><div class="k">Best return found</div><div class="v brand">+${bestRoi.toFixed(0)}%</div><div class="n">At your ${APP.target}% target, on the strongest pick</div></div>
    </div>
    <div class="toolbar">
      <div class="filterbar">${filterChips}</div>
      <input class="search" id="searchbox" placeholder="Search address, owner, or area" value="${APP.search}">
    </div>
    <div id="listmap"></div>
    <div class="listwrap">
      <table>
        <thead><tr>
          <th onclick="setSort('addr')">Property</th>
          <th onclick="setSort('zone')">Area</th>
          <th>Read</th>
          <th class="num" onclick="setSort('floor')">Floor bid</th>
          <th class="num" onclick="setSort('opportunity')">Return</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  $("#searchbox").addEventListener("input",e=>{APP.search=e.target.value; renderListRowsOnly();});
  initListMap();
}
function renderListRowsOnly(){
  const tbody=$("#view-list tbody"); if(!tbody)return;
  tbody.innerHTML=visibleProps().map(rowHtml).join("");
  drawListMap();
}
function setFilter(f){APP.filter=f;renderList();}
function setSort(k){ if(APP.sort.key===k)APP.sort.dir*=-1; else {APP.sort.key=k;APP.sort.dir=(k==="addr"||k==="zone")?1:-1;} renderList(); }

/* ============================================================
   DEAL VIEW
   ============================================================ */
let selComp=-1;
function openDeal(id){ APP.selectedId=id; APP.view="deal"; APP.uwMode="single"; selComp=-1; render(); }
function backToList(){ APP.view="list"; render(); }

function renderDeal(){
  const p=prop();
  if(!p.researched){
    const c=CATMETA[p.cat];
    $("#view-deal").innerHTML=`
      <div class="card"><div class="tierband U" style="background:${c.color}1a;color:${c.color}">◌ ${c.label}</div>
      <div class="cb">
        <div class="dealhead"><h2>${p.addr}</h2><div class="loc">${p.zoneName} · Owner of record ${p.owner} · Parcel ${p.id}</div></div>
        <div class="factgrid">
          <div class="fcell"><div class="k">Floor bid</div><div class="v mono">${M(p.floor)}</div></div>
          <div class="fcell"><div class="k">Category</div><div class="v" style="font-size:13px;color:${c.color}">${c.label}</div></div>
        </div>
        <div class="readout">${c.why}</div>
        <div class="reason"><span class="lead">What turns this into a full analysis</span>This parcel has not been individually researched yet. The next step is to pull a comparable sale or a current listing for the block, confirm the property type and condition, and check the redevelopment and tornado overlays. Once that data is attached it gets a verified or verify-first rating, a map of nearby comparables, and the live underwriting model on the right.</div>
        <div style="margin-top:16px"><button class="btn primary" onclick="backToList()">Back to the sale list</button></div>
      </div></div>`;
    return;
  }
  const sA=scenarioFor(p.id,"A");
  const tm=TIERMETA[p.tier];
  const strat='<span class="strat-main pill '+STRAT[p.strat].cls+'">'+STRAT[p.strat].t+'</span>'+(p.strat2?'<span class="strat-or">or possibly '+STRAT[p.strat2].t.toLowerCase()+'</span>':"");

  // risk rows
  const riskMeta={data:{label:"How confident the value is",sub:"Based on the quality of the comparables"},
    redemption:{label:"Chance the owner pays off first",sub:"Higher means more likely to vanish before sale day"},
    title:{label:"How clean the title looks",sub:"Affects how fast you can resell"}};
  const lvlMap={good:{n:1,cls:"good",t:"Low"},mid:{n:2,cls:"mid",t:"Medium"},bad:{n:3,cls:"bad",t:"High"}};
  let riskRows="";
  ["data","redemption","title"].forEach(k=>{
    const lvl=p.risk[k],m=lvlMap[lvl];
    // for "data" and "title", good = low risk = green; for redemption, good=low chance=green
    let pips="";for(let i=0;i<3;i++)pips+='<span class="pip'+(i<m.n?" on "+m.cls:"")+'"></span>';
    riskRows+='<div class="risk-row"><div class="rk">'+riskMeta[k].label+'<small>'+riskMeta[k].sub+'</small></div><div class="meter"><span class="mlabel '+m.cls+'">'+m.t+'</span>'+pips+'</div></div>';
  });

  // LEFT
  const left=`
    <div class="card">
      <div class="tierband ${p.tier}">${p.tier==="A"?"✓":"!"} ${tm.label}</div>
      <div class="cb">
        <div class="dealhead">
          <h2>${p.addr}</h2>
          <div class="loc">${p.zoneName} · Owner of record ${p.owner} · Parcel ${p.id}</div>
        </div>
        <div class="strat-line">${strat}</div>
        <div class="factgrid">
          <div class="fcell"><div class="k">Property type</div><div class="v" style="font-size:13.5px">${p.type}</div></div>
          <div class="fcell"><div class="k">Size</div><div class="v" style="font-size:13.5px">${p.size}</div></div>
          <div class="fcell"><div class="k">Floor bid</div><div class="v mono">${M(p.floor)}</div></div>
          <div class="fcell"><div class="k">Estimated value</div><div class="v mono">${M(sA.arv)}</div></div>
        </div>
        <div class="readout">${p.readout}</div>
        <div class="reason"><span class="lead">Why we are confident, and where we are not</span>${p.reason}</div>
        <div class="riskline">${riskRows}</div>
      </div>
    </div>`;

  // CENTER (map + comps)
  let layers='';
  [["comps","Comparable sales","#2E8460"],["amenities","Nearby places","#6C665B"],["tornado","Tornado context","#B4453A"]].forEach(([k,label,c])=>{
    layers+='<button class="layer'+(dealLayers[k]?" on":"")+'" onclick="toggleLayer(\''+k+'\')"><span class="ld" style="background:'+c+'"></span>'+label+'</button>';
  });
  const center=`
    <div class="card">
      <div class="ch"><h3>The neighborhood</h3><span class="note">Pins are approximate in this prototype</span></div>
      <div class="cb">
        <div id="dealmap"></div>
        <div class="maptools">
          <div class="layers">${layers}</div>
        </div>
        <div class="maplegend" style="margin-top:11px">
          <div><span class="ldot" style="background:#BE7C16"></span>This property</div>
          <div><span class="ldot" style="background:#2E8460"></span>Recorded sale</div>
          <div><span class="ldot" style="background:#3F7AA6"></span>Assessor or other</div>
        </div>
        <div class="ch" style="padding:18px 0 0"><h3>Comparable values and where they came from</h3></div>
        <div class="complist" id="comps"></div>
      </div>
    </div>`;

  // RIGHT (underwriting)
  const right=`
    <div class="card">
      <div class="ch"><h3>The numbers</h3></div>
      <div class="cb">
        <div class="uw-toggle">
          <button class="${APP.uwMode==='single'?'on':''}" onclick="setUw('single')">One scenario</button>
          <button class="${APP.uwMode==='compare'?'on':''}" onclick="setUw('compare')">Compare two</button>
        </div>
        <div id="uwbody"></div>
      </div>
    </div>`;

  $("#view-deal").innerHTML=`<div class="deal">${left}${center}${right}</div>`;
  renderComps();
  renderUw();
  initDealMap();
}

function renderComps(){
  const p=prop(); const box=$("#comps"); if(!box)return;
  box.innerHTML=p.comps.map((c,i)=>{
    const sm=SRCMETA[c.src];
    const photo = c.photo ? '<img src="'+c.photo+'">' : 'No photo yet';
    let meta='<span class="tag '+sm.cls+'">'+sm.t+'</span>';
    if(c.dist>0) meta+='<span class="metabit"><b>'+c.dist+'</b> mi away</span>';
    if(c.date&&c.date!=="current"&&c.date!=="prior") meta+='<span class="metabit">sold <b>'+c.date+'</b></span>';
    if(c.ppsf) meta+='<span class="metabit"><b>$'+c.ppsf+'</b>/sq ft</span>';
    if(typeof c.sim==="number") meta+='<span class="simbar" title="similarity"><i style="width:'+c.sim+'%"></i></span>';
    meta+= c.url ? '<span class="sourcelink">View source</span>' : '<span class="sourcelink disabled">Source link pending</span>';
    return '<div class="comp'+(selComp===i?" sel":"")+'" onclick="pickComp('+i+')">'+
      '<div class="comp-top"><div class="comp-photo">'+photo+'</div>'+
      '<div class="comp-mid"><div class="comp-label">'+c.label+'</div><div class="comp-note">'+c.note+'</div></div>'+
      '<div class="comp-val">'+c.val+'</div></div>'+
      '<div class="comp-meta">'+meta+'</div></div>';
  }).join("");
}
function pickComp(i){ selComp=i; renderComps(); if(dealOK&&dealMarkers[i]) dealMarkers[i].openPopup(); }
function toggleLayer(k){ dealLayers[k]=!dealLayers[k]; drawDealMap(); renderDeal(); }

function setUw(mode){ APP.uwMode=mode; renderUw(); }
function setTarget(d){ APP.target=Math.max(5,Math.min(80,APP.target+d)); renderUw(); }
function toggleAdv(){ APP.advOpen=!APP.advOpen; renderUw(); }

const SLIDERS_CORE=[["bid","Winning bid",M],["arv","Resale value",M],["rehab","Rehab budget",M],["months","Months to sell",v=>v+" months"]];
const SLIDERS_ADV=[["title","Cost to clear title",M],["holdPerMo","Holding cost per month",M],["sellPct","Selling cost",v=>v+"%"]];
const FMT={bid:M,arv:M,rehab:M,months:v=>v+" months",title:M,holdPerMo:M,sellPct:v=>v+"%"};
const FMT_MINI={bid:M,arv:M,rehab:M,months:v=>v+"mo"};

function chainHtml(s,r){
  const scale=Math.max(r.totalCost,s.arv);
  const segs=[["Winning bid",s.bid,"#BE7C16"],["Title",s.title,"#9C6610"],["Rehab",s.rehab,"#C46A26"],["Holding",r.holding,"#A98A4E"],["Selling",r.sellCost,"#8A7A5E"]];
  let bars=segs.map(seg=>{const v=seg[1];if(v<=0)return"";const w=v/scale*100;return '<div class="seg2" style="width:'+w+'%;background:'+seg[2]+'">'+(w>11?'<span>'+Mk(v)+'</span>':"")+'</div>';}).join("");
  let leg=segs.filter(s2=>s2[1]>0).map(seg=>'<div><span class="csw" style="background:'+seg[2]+'"></span>'+seg[0]+'</div>').join("");
  return `<div class="chainwrap">
    <div class="chain-cap"><span>Everything you put in</span><span>${M(r.totalCost)}</span></div>
    <div class="track">${bars}</div>
    <div class="chain-cap" style="margin-top:7px"><span>What you sell for</span><span>${M(s.arv)}</span></div>
    <div class="track"><div class="seg2" style="width:${s.arv/scale*100}%;background:linear-gradient(90deg,#2E8460,#3FA178)"><span>${M(s.arv)}</span></div></div>
    <div class="chain-legend">${leg}</div>
  </div>`;
}
/* the readouts that change as you drag, kept separate from the sliders */
function singleDynHtml(s,r){
  const over=s.bid>r.walk, headroom=r.walk-s.bid;
  const walk=`<div class="walk${over?" over":""}">
      <div class="wk">${over?"You are above your ceiling":"Bid up to this and stop"}</div>
      <div class="wv">${M(Math.max(0,r.walk))}</div>
      <div class="ws">${over
        ? 'Your planned bid of <b>'+M(s.bid)+'</b> is <b>'+M(s.bid-r.walk)+'</b> more than the most you can pay and still earn your '+APP.target+' percent return.'
        : 'This is the highest you can bid and still clear your '+APP.target+' percent target. You have <b>'+M(headroom)+'</b> of room above your planned bid of <b>'+M(s.bid)+'</b>.'}</div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:11px;font-size:12.5px;color:var(--ink-soft)">
        <span>Target return</span>
        <button class="btn ghost" style="padding:3px 9px" onclick="setTarget(-5)">–</button>
        <b style="font-family:var(--mono);color:var(--brand-deep)">${APP.target}%</b>
        <button class="btn ghost" style="padding:3px 9px" onclick="setTarget(5)">+</button>
      </div>
    </div>`;
  const outs=`<div class="outs">
      <div class="ocell"><div class="k">Net profit</div><div class="v ${r.net>=0?"pos":"neg"}">${Mk(r.net)}</div></div>
      <div class="ocell"><div class="k">Return</div><div class="v ${r.roi>=0?"pos":"neg"}">${r.roi>=0?"+":""}${r.roi.toFixed(0)}%</div></div>
      <div class="ocell"><div class="k">Per year</div><div class="v ${r.ann>=0?"pos":"neg"}">${r.ann>=0?"+":""}${r.ann.toFixed(0)}%</div></div>
    </div>`;
  return walk+outs+chainHtml(s,r);
}
function ctrlHtml(letter,k,lab,fmt,s,p){
  let mn,mx,step;
  if(k==="months"){mn=3;mx=18;step=1;}
  else if(k==="sellPct"){mn=3;mx=12;step=0.5;}
  else if(k==="holdPerMo"){mn=0;mx=1200;step=50;}
  else if(k==="title"){mn=0;mx=12000;step=50;}
  else {mn=0;mx=(p.max&&p.max[k])||s[k]*2;step=(k==="arv"||k==="bid")?500:250;}
  return '<div class="ctrl"><div class="ctrl-top"><label>'+lab+'</label><span class="val" id="val-'+letter+'-'+k+'">'+fmt(s[k])+'</span></div>'+
    '<input type="range" min="'+mn+'" max="'+mx+'" step="'+step+'" value="'+s[k]+'" oninput="onSlide(\''+letter+'\',\''+k+'\',+this.value)"></div>';
}

function renderUw(){
  const p=prop(); const box=$("#uwbody"); if(!box)return;
  if(APP.uwMode==="single"){
    const s=scenarioFor(p.id,"A"); const r=calc(s,APP.target);
    const core=SLIDERS_CORE.map(([k,lab,fmt])=>ctrlHtml("A",k,lab,fmt,s,p)).join("");
    const adv=SLIDERS_ADV.map(([k,lab,fmt])=>ctrlHtml("A",k,lab,fmt,s,p)).join("");
    box.innerHTML='<div id="uw-dyn">'+singleDynHtml(s,r)+'</div>'+
      '<div style="margin-top:16px">'+core+'</div>'+
      '<div class="advanced"><div class="adv-toggle" onclick="toggleAdv()">'+(APP.advOpen?"▾":"▸")+' Every other assumption</div><div class="adv-body'+(APP.advOpen?" open":"")+'">'+adv+'</div></div>'+
      '<button class="reset" onclick="resetScenario(\'A\')">Reset to the researched estimate</button>';
  } else {
    const sA=scenarioFor(p.id,"A"), sB=scenarioFor(p.id,"B");
    const rA=calc(sA,APP.target), rB=calc(sB,APP.target);
    function col(s,r,color,letter){
      const mini=[["bid","Bid"],["arv","Resale"],["rehab","Rehab"],["months","Months"]].map(([k,lab])=>
        '<div class="mini-ctrl"><div class="ctrl-top"><label>'+lab+'</label><span class="val" id="val-'+letter+'-'+k+'">'+FMT_MINI[k](s[k])+'</span></div>'+
        '<input type="range" min="'+(k==="months"?3:0)+'" max="'+((p.max&&p.max[k])||(k==="months"?18:s[k]*2))+'" step="'+(k==="months"?1:500)+'" value="'+s[k]+'" oninput="onSlide(\''+letter+'\',\''+k+'\',+this.value)"></div>').join("");
      return '<div class="cmp-col"><h4><span class="badge" style="background:'+color+'">'+letter+'</span>Scenario '+letter+'</h4>'+
        '<div id="cmpdyn-'+letter+'">'+cmpDynHtml(r)+'</div><div style="margin-top:12px">'+mini+'</div></div>';
    }
    box.innerHTML='<div class="cmp">'+col(sA,rA,"#BE7C16","A")+col(sB,rB,"#3F7AA6","B")+'</div>'+
      '<div class="delta" id="cmp-delta">'+cmpDeltaHtml(rA,rB)+'</div>'+
      '<button class="reset" onclick="resetScenario(\'B\')">Reset scenario B to match A</button>';
  }
}
function cmpDynHtml(r){
  return '<div class="cmp-walk">'+M(Math.max(0,r.walk))+'</div><div style="font-size:11px;color:var(--ink-soft);margin-bottom:8px">walk-away bid</div>'+
    '<div class="cmp-line"><span class="l">Net profit</span><span class="r" style="color:'+(r.net>=0?'var(--good)':'var(--risk)')+'">'+Mk(r.net)+'</span></div>'+
    '<div class="cmp-line"><span class="l">Return</span><span class="r" style="color:'+(r.roi>=0?'var(--good)':'var(--risk)')+'">'+(r.roi>=0?"+":"")+r.roi.toFixed(0)+'%</span></div>';
}
function cmpDeltaHtml(rA,rB){
  const dNet=rB.net-rA.net, dRoi=rB.roi-rA.roi;
  return 'Compared with scenario A, scenario B '+(dNet>=0?"earns":"loses")+' <b style="color:'+(dNet>=0?'var(--good)':'var(--risk)')+'">'+Mk(Math.abs(dNet))+'</b> '+(dNet>=0?"more":"less")+' and shifts the return by <b style="color:'+(dRoi>=0?'var(--good)':'var(--risk)')+'">'+(dRoi>=0?"+":"")+dRoi.toFixed(0)+' points</b>. Drag either column to test a different situation.';
}

/* onSlide updates state and patches only the readouts, leaving the slider you
   are dragging in place so the drag is never interrupted */
function onSlide(letter,k,v){
  const p=prop(); scenarioFor(p.id,letter)[k]=v;
  const lab=document.getElementById('val-'+letter+'-'+k);
  if(lab) lab.textContent=(APP.uwMode==="compare"?FMT_MINI[k]:FMT[k])(v);
  if(APP.uwMode==="single"){
    const s=scenarioFor(p.id,"A"); const dyn=document.getElementById('uw-dyn');
    if(dyn) dyn.innerHTML=singleDynHtml(s,calc(s,APP.target));
  } else {
    const rA=calc(scenarioFor(p.id,"A"),APP.target), rB=calc(scenarioFor(p.id,"B"),APP.target);
    const a=document.getElementById('cmpdyn-A'), b=document.getElementById('cmpdyn-B'), d=document.getElementById('cmp-delta');
    if(a) a.innerHTML=cmpDynHtml(rA); if(b) b.innerHTML=cmpDynHtml(rB); if(d) d.innerHTML=cmpDeltaHtml(rA,rB);
  }
}
function setUw(mode){ APP.uwMode=mode; renderUw(); }
function setTarget(d){ APP.target=Math.max(5,Math.min(80,APP.target+d)); renderUw(); }
function toggleAdv(){ APP.advOpen=!APP.advOpen; renderUw(); }
function resetScenario(letter){ const id=prop().id; if(letter==="A"){APP.scenarios[id].A=Object.assign({},prop().d);} else {APP.scenarios[id].B=Object.assign({},scenarioFor(id,"A"));} renderUw(); }

/* ============================================================
   CHAT — scripted surface that drives the app
   ============================================================ */
const CHAT_SCRIPTS=[
 {q:"Show me the cheapest land play",act:()=>{APP.filter="land";APP.view="list";render();setTimeout(()=>openDeal("237-005"),350);},
  a:"The standout piece of land is <b>2003 Park Ave in Lafayette Square</b>, opening at just over four thousand dollars. I have filtered the list to land and opened it for you. Because it is an empty lot, there is nothing to inspect or evict, and it sits in one of the strongest infill markets in the city."},
 {q:"Which deal has the strongest evidence?",act:()=>openDeal("237-156"),
  a:"That would be <b>7353 Virginia Ave</b>. It is the rare case where the house itself is listed for sale right now, and two houses on the same block have recorded sales that bracket the value. I have opened it so you can see the comparables. Notice the recorded-sale tags, which carry more weight than an automated estimate."},
 {q:"What if I had to sell in six months?",act:()=>{if(APP.view!=="deal"||!prop().researched)openDeal("237-156");APP.uwMode="single";const s=scenarioFor(prop().id,"A");s.months=6;render();},
  a:"I have set the timeline on the property you are viewing to six months. Watch the walk-away bid and the annual return update. A shorter hold lowers your holding cost but leaves less room for surprises, so the per-year return often looks better while the cushion gets thinner."},
 {q:"Compare two ways to play 920 Bates",act:()=>{openDeal("237-125");setTimeout(()=>{APP.uwMode="compare";const sB=scenarioFor("237-125","B");sB.bid=45000;sB.rehab=30000;sB.months=14;renderUw();},300);},
  a:"I have opened <b>920 Bates St</b> and set up a comparison. Scenario A is the conservative researched estimate. Scenario B imagines paying more at auction and doing a deeper renovation over a longer hold. Drag either column to see how the return moves between a quick light touch and a fuller project."},
 {q:"Why is the Hickory house risky if it looks cheap?",act:()=>openDeal("237-002"),
  a:"Good instinct to ask. <b>2350 Hickory</b> shows a huge paper spread, but the risk is not the value, it is whether you can win it. It is already listed at three hundred thousand, so the owner will likely pay off the taxes before sale day, and if it does reach the auction it gets bid into the six figures. I opened it so you can see the confidence read explains exactly this."}
];
function renderChatSuggest(){
  $("#sugg").innerHTML=CHAT_SCRIPTS.map((s,i)=>'<button onclick="askChat('+i+')">'+s.q+'</button>').join("");
}
function pushMsg(who,html){
  const b=$("#chatbody"); const d=document.createElement("div"); d.className="msg "+who; d.innerHTML=html; b.appendChild(d); b.scrollTop=b.scrollHeight;
}
function askChat(i){
  const s=CHAT_SCRIPTS[i];
  pushMsg("user",s.q);
  setTimeout(()=>{ s.act(); pushMsg("bot",s.a); },200);
}
$("#chatfab").onclick=()=>{APP.chatOpen=true;$("#chatpanel").classList.add("open");$("#chatfab").style.display="none";
  if(!$("#chatbody").dataset.init){$("#chatbody").dataset.init="1";pushMsg("bot","Hello. I can help you navigate this sale and reason about any property. Tap one of the questions below and watch the list, the map, and the numbers respond. In the live version you will be able to type freely.");}};
$("#chatx").onclick=()=>{APP.chatOpen=false;$("#chatpanel").classList.remove("open");$("#chatfab").style.display="flex";};

/* ============================================================
   RENDER ROOT + crumbs + footnote
   ============================================================ */
function renderCrumbs(){
  if(APP.view==="list"){ $("#crumbs").innerHTML='Sale 237 overview'; }
  else { const p=prop(); $("#crumbs").innerHTML='<a onclick="backToList()">Sale 237 overview</a> &nbsp;›&nbsp; '+p.addr; }
}
function renderFootnote(){
  $("#footnote").innerHTML=`<b>About this prototype.</b> The full sale list is real, taken from the Sale 237 notice. Fifteen properties carry researched valuations with real comparables pulled from public sources. Every remaining parcel is sorted into an honest category with a stated reason rather than left blank, so the leads worth your time are separated from the parcels to pass on. Map positions are approximate placeholders until addresses are geocoded, the nearby-places layer is illustrative until a places data source is connected, and comparable photos and source links appear as empty states because that data needs a live listing feed. None of this is investment advice. Always confirm condition, occupancy, title, and redemption status before bidding.`;
}
function render(){
  renderCrumbs();
  if(APP.view==="list"){ $("#view-list").classList.remove("hidden"); $("#view-deal").classList.add("hidden"); renderList(); }
  else { $("#view-list").classList.add("hidden"); $("#view-deal").classList.remove("hidden"); renderDeal(); }
  renderFootnote();
}
renderChatSuggest();
render();
</script>
</body>
</html>
